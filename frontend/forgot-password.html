<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Esqueci minha senha | Finza</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="single">
    <div class="logo"><span class="logo-mark">F</span> Finza</div>

    <div class="auth-card">
      <h1>Esqueceu a senha?</h1>
      <p class="subtitle">Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>

      <form id="forgot-form">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required />

        <div id="message" class="message" hidden></div>

        <button type="submit" id="submit-button" class="btn">Enviar link</button>
      </form>

      <p class="link"><a href="index.html">Voltar para o login</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
