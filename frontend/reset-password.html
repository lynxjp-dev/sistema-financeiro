<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Nova senha | Finza</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="single">
    <div class="logo"><span class="logo-mark">F</span> Finza</div>

    <div class="auth-card">
      <h1>Criar nova senha</h1>
      <p class="subtitle">Escolha uma senha forte para a sua conta.</p>

      <form id="reset-form">
        <label for="password">Nova senha</label>
        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="Nova senha" autocomplete="new-password" required minlength="8" maxlength="72" />
          <button type="button" class="toggle-password" aria-label="Mostrar senha">Mostrar</button>
        </div>
        <p class="hint">Mínimo de 8 caracteres, com letras e números.</p>

        <label for="confirmPassword">Confirmar nova senha</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita a senha" autocomplete="new-password" required />
          <button type="button" class="toggle-password" aria-label="Mostrar senha">Mostrar</button>
        </div>

        <button type="submit" id="submit-button" class="btn">Salvar nova senha</button>
      </form>

      <div id="message" class="message" hidden></div>

      <p class="link"><a href="forgot-password.html">Pedir um novo link</a> · <a href="index.html">Ir para o login</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
